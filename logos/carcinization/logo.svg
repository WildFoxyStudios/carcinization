<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t d">
  <title id="t">Carcinization OS</title>
  <desc id="d">A crab emblem: a broad carapace with two raised pincers, stalked eyes and six legs.</desc>

  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#f4693a"/>
      <stop offset="1" stop-color="#cf3d1c"/>
    </linearGradient>
    <linearGradient id="shellDark" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#d2401f"/>
      <stop offset="1" stop-color="#a82c11"/>
    </linearGradient>
  </defs>

  <g transform="translate(256 265) scale(1.1) translate(-256 -265)">

    <!-- legs -->
    <g fill="none" stroke="url(#shellDark)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 150 304 C 132 328 116 346 100 362"/>
      <path d="M 161 330 C 145 356 131 378 117 398"/>
      <path d="M 179 346 C 167 372 155 396 143 418"/>
      <path d="M 362 304 C 380 328 396 346 412 362"/>
      <path d="M 351 330 C 367 356 381 378 395 398"/>
      <path d="M 333 346 C 345 372 357 396 369 418"/>
    </g>

    <!-- eye stalks -->
    <g fill="none" stroke="#a82c11" stroke-width="13" stroke-linecap="round">
      <path d="M 224 228 C 222 202 218 186 212 172"/>
      <path d="M 288 228 C 290 202 294 186 300 172"/>
    </g>

    <!-- claws -->
    <g>
      <g transform="translate(112 190) rotate(-30)">
        <ellipse cx="0" cy="0" rx="42" ry="34" fill="url(#shell)"/>
        <g fill="none" stroke="url(#shell)" stroke-width="28" stroke-linecap="round">
          <path d="M -23 -16 C -46 -34 -48 -62 -21 -70"/>
          <path d="M 23 -16 C 46 -34 48 -62 21 -70"/>
        </g>
      </g>
      <g transform="translate(400 190) rotate(30) scale(-1,1)">
        <ellipse cx="0" cy="0" rx="42" ry="34" fill="url(#shell)"/>
        <g fill="none" stroke="url(#shell)" stroke-width="28" stroke-linecap="round">
          <path d="M -23 -16 C -46 -34 -48 -62 -21 -70"/>
          <path d="M 23 -16 C 46 -34 48 -62 21 -70"/>
        </g>
      </g>
    </g>

    <!-- arms -->
    <g fill="none" stroke="url(#shellDark)" stroke-width="18" stroke-linecap="round">
      <path d="M 176 274 C 146 256 122 224 114 196"/>
      <path d="M 336 274 C 366 256 390 224 398 196"/>
    </g>

    <!-- carapace -->
    <path fill="url(#shell)" d="M 256 212
             C 322 212 372 250 372 294
             C 372 330 326 352 256 352
             C 186 352 140 330 140 294
             C 140 250 190 212 256 212 Z"/>

    <!-- carapace highlight -->
    <path fill="none" stroke="#ff9d72" stroke-width="9" stroke-linecap="round" opacity="0.65"
          d="M 196 252 C 222 236 290 236 316 252"/>

    <!-- eyes -->
    <g>
      <circle cx="209" cy="148" r="27" fill="#3b2013"/>
      <circle cx="303" cy="148" r="27" fill="#3b2013"/>
      <circle cx="200" cy="139" r="9" fill="#ffffff"/>
      <circle cx="294" cy="139" r="9" fill="#ffffff"/>
    </g>
  </g>
</svg>
